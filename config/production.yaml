# Loco configuration file documentation
#
# This is the production environment. It differs from development in one
# deliberate way: anything that is a secret or an address takes no default.
# `get_env(name="X")` with no `default` fails at startup if `X` is unset, which
# is what you want — a production app that silently falls back to a development
# secret or a localhost database is worse than one that refuses to boot.
#
# The variables this file requires:
#   DATABASE_URL, JWT_SECRET, HOST, and the MAILER_* / REDIS_URL set below,
#   depending on which features you generated.

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1). Off in production: it
  # costs performance and puts source paths into your logs.
  pretty_backtrace: false
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Define the logging format. options: compact, pretty or json
  # `json` is the machine-readable one, for a log aggregator.
  format: json
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to).
  # `0.0.0.0`, not `localhost`: inside a container or a VM, a server bound to
  # loopback is unreachable from outside it.
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  # The UI hostname or IP address that mailers will point to.
  # Required: links in outgoing mail have to name the real host.
  host: <%= get_env(name="HOST") %>
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    limit_payload:
      body_limit: 11mb
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundAsync

  

# Mailer Configuration.
mailer:
  # Loco's own mailer (used by src/mailers, for example the welcome email). Development defaults to a local
  # catcher such as Mailpit (SMTP on 1025, inbox on http://localhost:8025):
  #   docker run -p 1025:1025 -p 8025:8025 axllent/mailpit
  # Prefer not to run one? Set `stub: true` here (as `config/test.yaml` does) to record deliveries in memory.
  # To send through Amazon SES instead, set in .env: MAILER_HOST=email-smtp.<region>.amazonaws.com, MAILER_PORT=587,
  # MAILER_SECURE=true, and uncomment `auth` below. Get the user and password with
  # `cargo run -- task mail:ses-smtp-password`. (The `mail` module has its own, separate settings under settings.mail.)
  smtp:
    enable: true
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    port: <%= get_env(name="MAILER_PORT", default="1025") %>
    # true = STARTTLS (what SES on port 587 needs), false = no encryption (local catcher)
    secure: <%= get_env(name="MAILER_SECURE", default="false") %>
    # auth:
    #   user: <%= get_env(name="MAILER_USER", default="") %>
    #   password: <%= get_env(name="MAILER_PASSWORD", default="") %>
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI. Required — there is no safe default for a
  # production database.
  uri: <%= get_env(name="DATABASE_URL") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool. Serving real traffic on the
  # development default of 1 serializes every request behind one connection.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  # Run migration up when application loaded.
  # Convenient for single-instance deploys. Turn it off if you run more than
  # one instance or migrate as a separate release step, so instances do not
  # race to migrate the same database.
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification. Required: a secret
    # committed to the repository is a secret your users can forge tokens with.
    # Must be base64 text, e.g. `openssl rand -base64 48`.
    secret: <%= get_env(name="JWT_SECRET") %>
    # Token expiration time in seconds
    expiration: 604800 # 7 days

# Short-lived cache used by `loco_modular::remember` (the Cache::remember equivalent).
cache:
  kind: InMem
  max_capacity: 1000

settings:
  # Database backups (module db-backup): to the private R2 bucket, separate from the site's own storage.
  # Switch on with DB_BACKUP_ENABLED=true in .env. Run: cargo run -- task backup:run only-db:true
  db_backup:
    enabled: <%= get_env(name="DB_BACKUP_ENABLED", default="false") %>
    name: <%= get_env(name="BACKUP_NAME", default="rust-starter") %>
    destinations: [offsite]
    disks:
      offsite:
        driver: s3
        bucket: <%= get_env(name="BACKUP_BUCKET", default="") %>
        region: auto
        endpoint: <%= get_env(name="BACKUP_ENDPOINT", default="") %>
        access_key_id: <%= get_env(name="BACKUP_ACCESS_KEY_ID", default="") %>
        secret_access_key: <%= get_env(name="BACKUP_SECRET_ACCESS_KEY", default="") %>
        prefix: <%= get_env(name="BACKUP_PREFIX", default="db-backups") %>
    retention:
      keep_all_days: 7
      keep_daily_days: 16
      keep_weekly_weeks: 8
      keep_monthly_months: 4
      keep_yearly_years: 2
    monitor_max_age_days: 1
  mail:
    # Sending email (module mail). driver: ses | smtp | log | capture. `log` writes .eml files and sends nothing.
    driver: "<%= get_env(name="MAIL_DRIVER", default="log") %>"
    from_address: "<%= get_env(name="MAIL_FROM_ADDRESS", default="noreply@example.com") %>"
    from_name: "<%= get_env(name="MAIL_FROM_NAME", default="Rust Starter") %>"
    log_path: storage/mail
    ses:
      region: "<%= get_env(name="AWS_SES_DEFAULT_REGION", default="us-east-1") %>"
      access_key_id: "<%= get_env(name="AWS_SES_ACCESS_KEY_ID", default="") %>"
      secret_access_key: "<%= get_env(name="AWS_SES_SECRET_ACCESS_KEY", default="") %>"
      configuration_set: "<%= get_env(name="AWS_SES_CONFIGURATION_SET", default="") %>"
    smtp:
      host: "<%= get_env(name="MAIL_SMTP_HOST", default="localhost") %>"
      port: <%= get_env(name="MAIL_SMTP_PORT", default="1025") %>
      username: "<%= get_env(name="MAIL_SMTP_USERNAME", default="") %>"
      password: "<%= get_env(name="MAIL_SMTP_PASSWORD", default="") %>"
      encryption: "<%= get_env(name="MAIL_SMTP_ENCRYPTION", default="none") %>"
  ai:
    # AI providers (module ai-service). Everything comes from .env; a provider with no key is simply not available.
    default_provider: "<%= get_env(name="AI_DEFAULT_PROVIDER", default="") %>"
    default_model: "<%= get_env(name="AI_DEFAULT_MODEL", default="") %>"
    max_tokens: "<%= get_env(name="AI_MAX_TOKENS", default="2048") %>"
    timeout_seconds: "<%= get_env(name="AI_TIMEOUT_SECONDS", default="60") %>"
    # false keeps prompts and replies out of the AI API logs (sizes, status and cost are still stored).
    log_content: "<%= get_env(name="AI_LOG_CONTENT", default="true") %>"
    claude:
      api_key: "<%= get_env(name="ANTHROPIC_API_KEY", default="") %>"
      model: "<%= get_env(name="CLAUDE_MODEL", default="") %>"
      input_per_million: "<%= get_env(name="CLAUDE_INPUT_USD_PER_MILLION_TOKENS", default="") %>"
      output_per_million: "<%= get_env(name="CLAUDE_OUTPUT_USD_PER_MILLION_TOKENS", default="") %>"
    openai:
      api_key: "<%= get_env(name="OPENAI_API_KEY", default="") %>"
      model: "<%= get_env(name="OPENAI_MODEL", default="") %>"
      input_per_million: "<%= get_env(name="OPENAI_INPUT_USD_PER_MILLION_TOKENS", default="") %>"
      output_per_million: "<%= get_env(name="OPENAI_OUTPUT_USD_PER_MILLION_TOKENS", default="") %>"
    gemini:
      api_key: "<%= get_env(name="GEMINI_API_KEY", default="") %>"
      model: "<%= get_env(name="GEMINI_MODEL", default="") %>"
      input_per_million: "<%= get_env(name="GEMINI_INPUT_USD_PER_MILLION_TOKENS", default="") %>"
      output_per_million: "<%= get_env(name="GEMINI_OUTPUT_USD_PER_MILLION_TOKENS", default="") %>"
    image:
      model: "<%= get_env(name="OPENAI_IMAGE_MODEL", default="") %>"
      size: "<%= get_env(name="OPENAI_IMAGE_SIZE", default="1024x1024") %>"
      quality: "<%= get_env(name="OPENAI_IMAGE_QUALITY", default="") %>"
      output_format: "<%= get_env(name="OPENAI_IMAGE_OUTPUT_FORMAT", default="") %>"
  media:
    # Uploaded files (module media). Where they live is chosen in .env: MEDIA_STORAGE=local (default) or r2.
    # With r2, MEDIA_DISK is the name written to the media table's `disk` column and MEDIA_PREFIX a folder in the bucket.
    # R2_PUBLIC_URL (the bucket's public address) makes public files load straight from R2 instead of through this app.
    disk: "<%= get_env(name="MEDIA_DISK", default="default") %>"
    prefix: "<%= get_env(name="MEDIA_PREFIX", default="") %>"
    disk_urls:
      "<%= get_env(name="MEDIA_DISK", default="default") %>": "<%= get_env(name="R2_PUBLIC_URL", default="") %>"
