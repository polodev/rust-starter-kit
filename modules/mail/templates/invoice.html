<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'Helvetica Neue',Arial,'Noto Sans Bengali',sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#1e3a5f;color:#ffffff;padding:20px 28px;font-size:20px;font-weight:700;">{{ seller }}</td></tr>
        <tr><td style="padding:28px;">
          <p style="margin:0 0 16px;font-size:16px;">Hello {{ customer }},</p>
          <p style="margin:0 0 16px;line-height:1.5;">Your invoice <strong>{{ number }}</strong> is attached as a PDF.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;border:1px solid #e5e7eb;border-radius:6px;width:100%;">
            <tr><td style="padding:12px 16px;color:#6b7280;">Amount due</td><td align="right" style="padding:12px 16px;font-size:18px;font-weight:700;color:#1e3a5f;">{{ currency }} {{ total }}</td></tr>
            <tr><td style="padding:12px 16px;color:#6b7280;border-top:1px solid #e5e7eb;">Due date</td><td align="right" style="padding:12px 16px;border-top:1px solid #e5e7eb;">{{ due }}</td></tr>
          </table>
          <p style="margin:0 0 8px;line-height:1.5;">Thank you for your business. ধন্যবাদ!</p>
          <p style="margin:0;color:#6b7280;font-size:13px;">If you have any questions, just reply to this email.</p>
        </td></tr>
        <tr><td style="background:#f9fafb;padding:14px 28px;color:#9ca3af;font-size:12px;">This message was sent by {{ seller }}.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
