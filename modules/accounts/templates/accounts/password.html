{% extends "accounts/layout.html" %}
{% block account_content %}
<h1 class="text-2xl font-bold text-brand-navy dark:text-white">{{ t(key="password-title", lang=tag) }}</h1>
<form method="post" action="/account/password" class="mt-6 max-w-md space-y-4">
  <label class="block"><span class="mb-1 block text-sm font-medium">{{ t(key="password-current", lang=tag) }}</span>
    <input type="password" name="current_password" required autocomplete="current-password" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-navy/30 dark:border-gray-600 dark:bg-gray-900 dark:text-slate-100"></label>
  <label class="block"><span class="mb-1 block text-sm font-medium">{{ t(key="password-new", lang=tag) }}</span>
    <input type="password" name="password" required autocomplete="new-password" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-navy/30 dark:border-gray-600 dark:bg-gray-900 dark:text-slate-100"></label>
  <label class="block"><span class="mb-1 block text-sm font-medium">{{ t(key="password-confirm", lang=tag) }}</span>
    <input type="password" name="password_confirmation" required autocomplete="new-password" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-navy/30 dark:border-gray-600 dark:bg-gray-900 dark:text-slate-100"></label>
  <p class="text-xs text-slate-500 dark:text-slate-400">{{ t(key="password-hint", lang=tag) }}</p>
  <button type="submit" class="rounded-md bg-brand-amber px-5 py-2 font-medium text-white hover:bg-amber-600">{{ t(key="password-save", lang=tag) }}</button>
</form>
{% endblock account_content %}
