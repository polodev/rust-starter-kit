<div class="mb-4 inline-flex flex-wrap overflow-hidden rounded-md border border-brand-navy text-sm" role="tablist" data-testid="qw-tabs">
  <a href="/admin/queue-watcher" data-testid="qw-tab-overview" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if qw_active == "overview" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-gauge-high text-xs"></i>Overview</a>
  <a href="/admin/queue-watcher/jobs" data-testid="qw-tab-jobs" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if qw_active == "jobs" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-list-check text-xs"></i>Tracked jobs</a>
  <a href="/admin/queue-watcher/pending" data-testid="qw-tab-pending" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if qw_active == "pending" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-regular fa-hourglass-half text-xs"></i>Pending jobs</a>
  <a href="/admin/queue-watcher/failed" data-testid="qw-tab-failed" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if qw_active == "failed" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-triangle-exclamation text-xs"></i>Failed jobs</a>
</div>
{% if status %}<p class="mb-4 rounded-md px-4 py-2 text-sm {% if status.kind == 'ok' %}bg-emerald-50 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-200{% else %}bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-200{% endif %}" data-testid="status">{{ status.text }}</p>{% endif %}
