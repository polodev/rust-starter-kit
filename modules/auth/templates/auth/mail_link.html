<!doctype html>
<html><body style="margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
  <div style="max-width:520px;margin:24px auto;background:#ffffff;border-radius:12px;padding:32px">
    <p style="margin:0 0 16px">{{ t(key="mail-greeting", lang=tag) }} {{ name }},</p>
    <p style="margin:0 0 24px">{{ t(key=intro_key, lang=tag) }}</p>
    <p style="margin:0 0 24px"><a href="{{ url }}" style="background:#d97706;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block">{{ t(key=button_key, lang=tag) }}</a></p>
    <p style="margin:0 0 8px;font-size:13px;color:#475569">{{ t(key="mail-link-once", lang=tag) }}</p>
    <p style="margin:0;font-size:13px;color:#475569">{{ t(key="mail-ignore", lang=tag) }}</p>
    <p style="margin:24px 0 0;font-size:12px;color:#94a3b8;word-break:break-all">{{ url }}</p>
  </div>
</body></html>
