{% extends "layouts/site.html" %}
{% block title %}{{ t(key="magic-confirm-title", lang=tag) }} | {{ t(key="site-name", lang=tag) }}{% endblock title %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-8">
  <h1 class="text-2xl font-bold text-brand-navy dark:text-white">{{ t(key="magic-confirm-title", lang=tag) }}</h1>
  <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">{{ t(key="magic-confirm-body", lang=tag) }}</p>
  <form method="post" action="/login/email-link/{{ secret }}" class="mt-6" data-testid="sign-in-link-confirm">
    <button type="submit" class="w-full rounded-md bg-brand-amber px-4 py-2 font-medium text-white hover:bg-amber-600">{{ t(key="magic-confirm-submit", lang=tag) }}</button>
  </form>
</div>
{% endblock content %}
