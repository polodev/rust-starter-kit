<div class="mb-4 inline-flex flex-wrap overflow-hidden rounded-md border border-brand-navy text-sm" role="tablist" data-testid="rp-tabs">
  <a href="/admin/role-permissions" data-testid="rp-tab-overview" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "overview" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-gauge-high text-xs"></i>Overview</a>
  <a href="/admin/role-permissions/roles" data-testid="rp-tab-roles" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "roles" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-user-tag text-xs"></i>Roles</a>
  <a href="/admin/role-permissions/permissions" data-testid="rp-tab-permissions" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "permissions" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-key text-xs"></i>Permissions</a>
  <a href="/admin/role-permissions/permissions-with-role-info" data-testid="rp-tab-matrix" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "matrix" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-table text-xs"></i>Permission Matrix</a>
  <a href="/admin/role-permissions/users" data-testid="rp-tab-users" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "users" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-users-gear text-xs"></i>User Assignments</a>
  <a href="/admin/role-permissions/locations" data-testid="rp-tab-locations" class="flex items-center gap-1.5 border-r border-brand-navy px-3 py-1.5 last:border-r-0 {% if rp_active == "locations" %}bg-brand-navy text-white{% else %}bg-white text-brand-navy hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700{% endif %}"><i class="fa-solid fa-link text-xs"></i>Backend Links</a>
</div>
{% if status %}<p class="mb-4 rounded-md px-4 py-2 text-sm {% if status.kind == 'ok' %}bg-emerald-50 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-200{% else %}bg-red-50 text-red-800 dark:bg-red-900/30 dark:text-red-200{% endif %}" data-testid="status">{{ status.text }}</p>{% endif %}
