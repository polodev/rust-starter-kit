{% extends "layouts/admin.html" %}
{% block content %}
<div class="mx-auto max-w-7xl space-y-3"
     x-data="{
       search: '',
       query() { return this.search.trim().toLowerCase(); },
       linkVisible(label, section) { const q = this.query(); return q === '' || (label + ' ' + section).toLowerCase().includes(q); },
       sectionVisible(el) {
         const q = this.query();
         if (q === '') return true;
         return Array.from(el.querySelectorAll('[data-nav-link]')).some(a => (a.dataset.label + ' ' + a.dataset.section).toLowerCase().includes(q));
       },
       anyVisible() { return this.query() === '' || Array.from(document.querySelectorAll('[data-nav-link]')).some(a => this.linkVisible(a.dataset.label, a.dataset.section)); },
     }">

  <!-- All navigation links: everything in the sidebar, in one searchable place -->
  <section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800" data-testid="nav-hub">
    <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5">
      <h1 class="text-lg font-bold text-gray-900 dark:text-white">All navigation links</h1>
      <div class="flex items-center gap-2 text-xs">
        <span class="rounded-full bg-gray-100 px-2.5 py-0.5 font-semibold text-gray-600 dark:bg-gray-700 dark:text-gray-200" data-testid="nav-section-count">{{ nav | length }} sections</span>
        <span class="rounded-full bg-orange-600 px-2.5 py-0.5 font-semibold text-white" data-testid="nav-link-count">{{ link_count }} links</span>
      </div>
    </div>
    <div class="border-t border-gray-200 px-4 py-2 dark:border-gray-700">
      <label class="relative block">
        <span class="sr-only">Search admin navigation</span>
        <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
        <input x-model.debounce.100ms="search" type="search" placeholder="Search users, roles, media, jobs..." data-testid="nav-search"
               class="w-full rounded-lg border border-gray-300 bg-white py-2 pl-10 pr-4 text-sm text-gray-900 shadow-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-500/30 dark:border-gray-600 dark:bg-gray-900 dark:text-white">
      </label>
    </div>
  </section>

  <div class="space-y-3 rounded-xl border border-gray-200 bg-white p-3 shadow-sm dark:border-gray-700 dark:bg-gray-800 sm:p-4">
    {% for section in nav %}
    <section data-nav-section="{{ section.title }}" x-show="sectionVisible($el)" x-transition.opacity>
      <h2 class="mb-1.5 text-[11px] font-bold uppercase tracking-[0.16em] text-orange-600 dark:text-orange-400">{{ section.title }}</h2>
      <div class="flex flex-wrap gap-1.5">
        {% for link in section.links %}
        <a href="{{ link.href }}" data-nav-link data-label="{{ link.label }}" data-section="{{ section.title }}"
           x-show="linkVisible($el.dataset.label, $el.dataset.section)" x-transition.opacity
           class="group inline-flex items-center gap-1.5 rounded-md border border-gray-200 bg-gray-50 px-2.5 py-1.5 text-xs font-semibold text-gray-700 transition hover:border-orange-300 hover:bg-orange-50 hover:text-orange-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:border-orange-800 dark:hover:bg-orange-950/40 dark:hover:text-orange-300">
          <i class="{{ link.icon }} w-3.5 text-center text-gray-400 transition group-hover:text-orange-500" aria-hidden="true"></i>
          <span>{{ link.label }}</span>
        </a>
        {% endfor %}
      </div>
    </section>
    {% endfor %}
    <p x-show="!anyVisible()" x-cloak class="py-6 text-center text-sm text-gray-500">No matching link.</p>
  </div>
</div>
{% endblock content %}
