{% if user %}
<div x-data="{ open: false }" class="relative">
  <button type="button" @click="open = !open" aria-haspopup="true" :aria-expanded="open" data-testid="user-menu"
          class="flex items-center rounded-md px-1 py-1.5 text-white transition-colors hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/70">
    <span class="relative mr-2 inline-flex h-7 w-7 shrink-0 items-center justify-center overflow-hidden rounded-full bg-brand-amber text-xs font-semibold text-white" aria-hidden="true">
      {{ user.initial }}
      {% if user.avatar_url %}<img src="{{ user.avatar_url }}" alt="" class="absolute inset-0 h-full w-full rounded-full object-cover" onerror="this.style.display='none'">{% endif %}
    </span>
    <span class="hidden max-w-32 truncate text-sm font-medium md:inline">{{ user.name }}</span>
    <svg class="ml-1 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>

  <div x-show="open" x-cloak x-transition @click.away="open = false" @keydown.escape.window="open = false"
       class="absolute right-0 z-50 mt-2 w-56 rounded-md border border-gray-200 bg-white py-1 text-gray-700 shadow-lg dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
    <div class="border-b border-gray-100 px-4 py-2 dark:border-gray-700">
      <p class="text-xs text-gray-500 dark:text-gray-400">{{ t(key="signed-in-as", lang=tag) }}</p>
      <p class="truncate text-sm font-semibold text-gray-800 dark:text-gray-100">{{ user.name }}</p>
      <p class="truncate text-xs text-gray-500 dark:text-gray-400">{{ user.email }}</p>
      {% if user.role_name %}<p class="mt-1 inline-block rounded bg-indigo-50 px-2 py-0.5 text-xs font-medium text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300">{{ user.role_name }}</p>{% endif %}
    </div>
    {% if user.can_view_admin %}
    <a href="/admin" data-testid="admin-link" class="block px-4 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
      {{ t(key="nav-admin", lang=tag) }}
    </a>
    {% endif %}
    <a href="/account/profile" data-testid="profile-link" class="block px-4 py-2 text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
      {{ t(key="nav-account", lang=tag) }}
    </a>
    <div class="mt-1 border-t border-gray-100 pt-1 dark:border-gray-700">
      <form method="post" action="/logout">
        <button type="submit" data-testid="logout" class="block w-full px-4 py-2 text-left text-sm text-red-600 transition-colors hover:bg-gray-100 dark:text-red-400 dark:hover:bg-gray-700">
          {{ t(key="nav-logout", lang=tag) }}
        </button>
      </form>
    </div>
  </div>
</div>
{% endif %}
