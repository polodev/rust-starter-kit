<div x-data="{ open: false }" class="relative">
  <button type="button" data-testid="theme-toggle" @click="open = !open" :aria-expanded="open.toString()"
          aria-label="{{ t(key="toggle-theme", lang=tag) }}" title="{{ t(key="toggle-theme", lang=tag) }}"
          class="flex h-9 w-9 items-center justify-center rounded-md text-white transition-colors hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/70">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
  </button>
  <div x-show="open" x-cloak x-transition @click.away="open = false" @keydown.escape.window="open = false"
       class="absolute right-0 z-50 mt-2 w-32 rounded-md border border-gray-200 bg-white py-1 shadow-lg dark:border-gray-700 dark:bg-gray-800">
    <button type="button" onclick="setAppearance('light'); open = false" data-theme-option="light"
            class="flex w-full items-center px-3 py-2 text-left text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
      <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      {{ t(key="theme-light", lang=tag) }}
    </button>
    <button type="button" onclick="setAppearance('dark'); open = false" data-theme-option="dark"
            class="flex w-full items-center px-3 py-2 text-left text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
      <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      {{ t(key="theme-dark", lang=tag) }}
    </button>
    <button type="button" onclick="setAppearance('system'); open = false" data-theme-option="system"
            class="flex w-full items-center px-3 py-2 text-left text-sm text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700">
      <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      {{ t(key="theme-system", lang=tag) }}
    </button>
  </div>
</div>
