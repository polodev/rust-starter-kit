{% extends "layouts/site.html" %}
{% block content %}
<section class="py-10 text-center">
  <h1 class="text-4xl font-bold tracking-tight text-brand-navy dark:text-white">{{ t(key="home-title", lang=tag) }}</h1>
  <p class="mx-auto mt-4 max-w-2xl text-lg text-slate-600 dark:text-slate-300">{{ t(key="home-subtitle", lang=tag) }}</p>
  <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
    <a href="/pages/about" class="inline-block rounded-lg bg-brand-amber px-6 py-3 font-medium text-white hover:bg-amber-600">{{ t(key="home-cta", lang=tag) }}</a>
    {% if not user %}
    <a href="/login" data-testid="home-login" class="inline-block rounded-lg border border-slate-300 px-6 py-3 font-medium text-slate-700 hover:bg-slate-100 dark:border-gray-600 dark:text-slate-200 dark:hover:bg-gray-700">{{ t(key="nav-login", lang=tag) }}</a>
    {% endif %}
  </div>
</section>
{% endblock content %}
