{% extends "layouts/site.html" %}
{% block title %}{{ page.title }} | {{ t(key="site-name", lang=tag) }}{% endblock title %}
{% block meta %}<meta name="description" content="{{ page.meta_description }}">{% endblock meta %}
{% block content %}
<article class="rounded-xl border border-slate-200 bg-white dark:border-gray-700 dark:bg-gray-800 p-6 sm:p-10">
  <h1 class="mb-6 text-3xl font-bold tracking-tight text-brand-navy dark:text-white">{{ page.title }}</h1>
  <div class="page-body">{{ page.body_html | safe }}</div>
</article>
{% endblock content %}
