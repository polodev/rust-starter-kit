; Supervisor programs for production (copy to /etc/supervisor/conf.d/app.conf, then `supervisorctl reread && supervisorctl update`).
; Adjust the paths and the user. The environment comes from the .env file next to the binary / the process environment.
; Set MAIL_EMBEDDED_WORKER=false in production, so only app-mail-worker sends queued mail.

[program:app-web]
command=/var/www/app/rust-starter-cli start --binding 127.0.0.1 --port 5150 --environment production
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/app/web.log
redirect_stderr=true

; The database mail queue worker (verification, password reset and sign-in link mails, retries). Runs until stopped.
[program:app-mail-worker]
command=/var/www/app/rust-starter-cli task mail:work --environment production
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/app/mail-worker.log
redirect_stderr=true

; Loco background jobs (workers), stored in Redis (QUEUE_REDIS_URL, with a password in production). Add one program per queue group, for example
; `start --worker emails` and `start --worker default`, and raise numprocs for a busy queue.
[program:app-queue-worker]
command=/var/www/app/rust-starter-cli start --worker --environment production
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/app/queue-worker.log
redirect_stderr=true

; Database queue worker (Laravel's queue:work): jobs dispatched with `dispatch(..)`. One program per group of queues,
; most important queue first. Set JOBS_EMBEDDED_WORKER=false in production, and raise numprocs for a busy queue.
[program:app-jobs-worker]
command=/var/www/app/rust-starter-cli task jobs:work queue:emails,default --environment production
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/app/jobs-worker.log
redirect_stderr=true

; Scheduled commands (purges, backups). Run exactly one of these.
[program:app-scheduler]
command=/var/www/app/rust-starter-cli start --scheduler --environment production
directory=/var/www/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/app/scheduler.log
redirect_stderr=true
